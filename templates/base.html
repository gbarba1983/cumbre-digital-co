<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Registro{% endblock %} | Cumbre Digital CO 2026</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

  <!-- Encabezado con el logo de texto del evento -->
  <header class="encabezado">
    <a href="{{ url_for('inicio') }}">
      <h1 class="logo">Cumbre <span class="resaltado">Digital</span> CO <span class="anio">2026</span></h1>
    </a>
    <p class="subtitulo">Transformación digital para PyMEs</p>
  </header>

  <main class="tarjeta {% block clase_tarjeta %}{% endblock %}">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">© 2026 Cumbre Digital CO · Transformación digital para PyMEs</footer>

  {% block scripts %}{% endblock %}
</body>
</html>
